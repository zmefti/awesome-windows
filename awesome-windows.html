<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Awesome Windows — Curated Tools & Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --bg: #0d0f12;
    --surface: #13161b;
    --border: #1e2229;
    --border-bright: #2a2f38;
    --text: #e8eaf0;
    --muted: #6b7280;
    --accent: #4f8eff;
    --accent-dim: rgba(79,142,255,0.12);
    --star: #f5c842;
    --oss: #3ecf8e;
    --paid: #ff6b6b;
    --card-hover: #181c22;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ── HEADER ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(13,15,18,0.92);
    backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.15rem;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--text);
    text-decoration: none;
  }

  .logo-dot { color: var(--accent); }

  .header-meta {
    display: flex;
    align-items: center;
    gap: 1.2rem;
    font-size: 0.72rem;
    color: var(--muted);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.68rem;
    font-weight: 500;
  }
  .badge-star { background: rgba(245,200,66,0.15); color: var(--star); }
  .badge-oss  { background: rgba(62,207,142,0.12); color: var(--oss); }
  .badge-paid { background: rgba(255,107,107,0.12); color: var(--paid); }

  /* ── HERO ── */
  .hero {
    padding: 4rem 2rem 2.5rem;
    max-width: 900px;
    margin: 0 auto;
  }

  .hero h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(2rem, 5vw, 3.2rem);
    letter-spacing: -0.04em;
    line-height: 1.1;
    margin-bottom: 1rem;
  }

  .hero h1 span { color: var(--accent); }

  .hero p {
    color: var(--muted);
    font-size: 0.85rem;
    max-width: 520px;
    margin-bottom: 1.6rem;
  }

  .legend {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }

  /* ── SEARCH ── */
  .search-wrap {
    padding: 0 2rem 1.5rem;
    max-width: 900px;
    margin: 0 auto;
  }

  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.7rem 1rem;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.82rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--accent); }

  /* ── NAV PILLS ── */
  .cat-nav {
    padding: 0 2rem 2rem;
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  .cat-pill {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    padding: 3px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    background: none;
    transition: all 0.15s;
    text-decoration: none;
  }
  .cat-pill:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  /* ── MAIN LAYOUT ── */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 2rem 4rem;
  }

  /* ── CATEGORY ── */
  .category {
    margin-bottom: 2.8rem;
  }

  .cat-header {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    margin-bottom: 0.8rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }

  .cat-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  .cat-count {
    font-size: 0.68rem;
    color: var(--muted);
  }

  /* ── APP GRID ── */
  .app-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 0.6rem;
  }

  .app-card {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 0.75rem 0.9rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s, background 0.15s, transform 0.12s;
    position: relative;
  }
  .app-card:hover {
    border-color: var(--border-bright);
    background: var(--card-hover);
    transform: translateY(-1px);
  }

  .app-logo {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    object-fit: contain;
    background: var(--bg);
    flex-shrink: 0;
    border: 1px solid var(--border);
  }

  .app-logo-fallback {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--accent);
    font-family: 'Syne', sans-serif;
    flex-shrink: 0;
    text-transform: uppercase;
  }

  .app-info { flex: 1; min-width: 0; }

  .app-name-row {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    flex-wrap: wrap;
  }

  .app-name {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 0.82rem;
    color: var(--text);
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .app-desc {
    font-size: 0.68rem;
    color: var(--muted);
    line-height: 1.45;
    margin-top: 0.2rem;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .tag { font-size: 0.65rem; line-height: 1; }
  .tag-star { color: var(--star); }
  .tag-oss  { color: var(--oss); }
  .tag-paid { color: var(--paid); }

  /* no-result */
  .no-result {
    text-align: center;
    padding: 4rem 0;
    color: var(--muted);
    font-size: 0.8rem;
    display: none;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }

  @media (max-width: 600px) {
    header { padding: 0 1rem; }
    .hero, .search-wrap, .cat-nav, main { padding-left: 1rem; padding-right: 1rem; }
    .app-grid { grid-template-columns: 1fr; }
  }
</style>

// Build category nav
const catNav = document.getElementById('catNav');
data.forEach(cat => {
  const a = document.createElement('a');
  a.className = 'cat-pill';
  a.href = '#' + cat.id;
  a.textContent = cat.name;
  catNav.appendChild(a);
});

// Render apps
function getLogo(app) {
  return `<img class="app-logo" src="${app.logo}" alt="${app.name} logo"
    onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div class="app-logo-fallback" style="display:none">${app.name.charAt(0)}</div>`;
}

function getTags(app) {
  let t = '';
  if (app.star) t += '<span class="tag tag-star" title="Personal Favorite">⭐</span>';
  if (app.oss)  t += '<span class="tag tag-oss"  title="Open Source">🟢</span>';
  if (app.paid) t += '<span class="tag tag-paid" title="Paid">💰</span>';
  return t;
}

const main = document.getElementById('main');
data.forEach(cat => {
  const section = document.createElement('section');
  section.className = 'category';
  section.id = cat.id;
  section.dataset.cat = cat.name.toLowerCase();

  const header = document.createElement('div');
  header.className = 'cat-header';
  header.innerHTML = `<h2 class="cat-title">${cat.name}</h2><span class="cat-count">${cat.apps.length} apps</span>`;
  section.appendChild(header);

  const grid = document.createElement('div');
  grid.className = 'app-grid';

  cat.apps.forEach(app => {
    const card = document.createElement('a');
    card.className = 'app-card';
    card.href = app.url;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
    card.dataset.name = app.name.toLowerCase();
    card.dataset.desc = app.desc.toLowerCase();
    card.innerHTML = `
      ${getLogo(app)}
      <div class="app-info">
        <div class="app-name-row">
          <span class="app-name">${app.name}</span>
          ${getTags(app)}
        </div>
        <div class="app-desc">${app.desc}</div>
      </div>`;
    grid.appendChild(card);
  });

  section.appendChild(grid);
  main.appendChild(section);
});

// Search
const searchEl = document.getElementById('search');
const noResult = document.getElementById('noResult');

searchEl.addEventListener('input', () => {
  const q = searchEl.value.toLowerCase().trim();
  let anyVisible = false;

  document.querySelectorAll('.category').forEach(section => {
    let catVisible = false;
    section.querySelectorAll('.app-card').forEach(card => {
      const match = !q || card.dataset.name.includes(q) || card.dataset.desc.includes(q);
      card.style.display = match ? '' : 'none';
      if (match) catVisible = true;
    });
    section.style.display = catVisible ? '' : 'none';
    if (catVisible) anyVisible = true;
  });

  noResult.style.display = anyVisible ? 'none' : 'block';
});
</script>
